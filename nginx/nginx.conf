load_module /etc/nginx/modules/ngx_stream_module.so;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name lp-rbpi;

        location /ha/ {
            proxy_pass http://homeassistant:8123/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket support (Home Assistant uses it)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /z2m/ {
            proxy_pass http://zigbee2mqtt:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket support (zigbee2mqtt frontend uses it)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

stream {
    # TCP proxy for PostgreSQL. All traffic on port 5432 is forwarded to ha_postgres.
    # Hostname-based routing does not apply to TCP streams; lp-rbpi.pg must resolve
    # to this host's IP via DNS or /etc/hosts on the client.
    server {
        listen 5432;
        proxy_pass ha_postgres:5432;
    }
}
